######################################
# Picom Config – NVIDIA + XMonad Tuning
# Nebu Edition 😎
######################################

# ✅ Richtiges Backend für NVIDIA
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# ✅ Kein Tearing
vsync = true;

# ✅ Kein FPS-Drop bei Games / Fullscreen
unredir-if-possible = false;

# ✅ Transparenz-Grundwerte
inactive-opacity = 0.92;
frame-opacity = 0.95;
active-opacity = 1.0;

# ✅ Fade-Animationen (smooth, nicht schleimig)
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# ✅ Schatten (clean look)
shadow = true;
shadow-radius = 10;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.35;
shadow-color = "#000000";

# ✅ Keine Schatten für Docks & UI
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Pasystray'",
  "class_g = 'Nm-applet'",
  "window_type = 'dock'",
  "window_type = 'tooltip'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'"
];

# ✅ Transparenz-Regeln (KORREKT!)
opacity-rule = [
  "88:class_g = 'kitty'",
  "80:class_g = 'Thunar'",
  "80:class_g = 'VSCodium'",
  "100:class_g = 'Steam'",
  "80:class_g = 'Polybar'"
];

# ✅ Fokus & Fenster-Erkennung
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# ✅ Performance
use-damage = true;

######################################
# Ende
######################################
